name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/requirements.lock
      - run: npm ci
      - run: npm run agent:python-setup
      - run: npm run agent:python-test
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
